<!DOCTYPE html>

    <meta name="description" content="Repositorio de estudio para el Certamen 2 de Física en la UTFSM. Accede a resúmenes, ejercicios resueltos y clases.">

    <meta property="og:type" content="website">

        <button class="filter-btn" data-filter="resumen">Resúmenes</button>
        <button class="filter-btn" data-filter="ejercicios">Ejercicios</button>
        <button class="filter-btn" data-filter="soluciones">Soluciones</button>
        <button class="filter-btn" data-filter="clases">Clases</button>
    </nav>

    <main class="container" id="content-container">
